
name: Daily Arabic Trend Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Generate Arabic video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python app.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: daily-trend-output
          path: output/
          retention-days: 7
          
