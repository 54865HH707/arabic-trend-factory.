name: Daily Trend Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build video
        run: python app.py
      - name: Upload daily video
        uses: actions/upload-artifact@v4
        with:
          name: daily-trend-output
          path: output/
          retention-days: 7
